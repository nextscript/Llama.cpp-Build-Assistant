name: Release Builds

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            artifact_name: Llama.cpp-Build-Assistant-Windows.zip
            pyinstaller_name: Llama.cpp-Build-Assistant-Windows
            icon_arg: build_assets/icon.ico
            add_data_sep: ";"
            # A folder bundle starts much faster than --onefile, which unpacks on every launch.
            bundle_mode: --onedir
            dist_path: dist/Llama.cpp-Build-Assistant-Windows
          - name: Linux
            runner: ubuntu-latest
            artifact_name: Llama.cpp-Build-Assistant-Linux
            pyinstaller_name: Llama.cpp-Build-Assistant-Linux
            icon_arg: build_assets/icon.png
            add_data_sep: ":"
            bundle_mode: --onefile
            dist_path: dist/Llama.cpp-Build-Assistant-Linux
          - name: macOS
            runner: macos-latest
            artifact_name: Llama.cpp-Build-Assistant-macOS.zip
            pyinstaller_name: Llama.cpp-Build-Assistant-macOS
            icon_arg: build_assets/icon.icns
            add_data_sep: ":"
            bundle_mode: --onefile
            dist_path: dist/Llama.cpp-Build-Assistant-macOS.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Test backend and Qt integration
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -p no:cacheprovider

      - name: Prepare icons
        run: python scripts/prepare_icons.py

      - name: Build executable
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            ${{ matrix.bundle_mode }} \
            --windowed \
            --noupx \
            --name "${{ matrix.pyinstaller_name }}" \
            --icon "${{ matrix.icon_arg }}" \
            --collect-data qfluentwidgets \
            --collect-submodules qfluentwidgets \
            --exclude-module qfluentwidgets.multimedia \
            --exclude-module PySide6.QtMultimedia \
            --exclude-module PySide6.QtMultimediaWidgets \
            --exclude-module PySide6.QtWebEngineCore \
            --exclude-module PySide6.QtWebEngineWidgets \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtPdf \
            --exclude-module PySide6.QtCharts \
            --exclude-module PySide6.Qt3DCore \
            --exclude-module tkinter \
            --exclude-module customtkinter \
            --add-data "icon.png${{ matrix.add_data_sep }}." \
            --add-data "logo.png${{ matrix.add_data_sep }}." \
            --add-data "logo_big.png${{ matrix.add_data_sep }}." \
            --add-data "VERSION${{ matrix.add_data_sep }}." \
            --add-data "data/sources.json${{ matrix.add_data_sep }}data" \
            --add-data "data/profiles.json${{ matrix.add_data_sep }}data" \
            --add-data "build_llamacpp.ps1${{ matrix.add_data_sep }}." \
            --add-data "build_llamacpp.sh${{ matrix.add_data_sep }}." \
            --add-data "build_assets/icon.ico${{ matrix.add_data_sep }}build_assets" \
            app.py

      - name: Smoke test Windows executable
        if: runner.os == 'Windows'
        run: python scripts/check_frozen_qt.py dist/Llama.cpp-Build-Assistant-Windows/Llama.cpp-Build-Assistant-Windows.exe

      - name: Normalize artifact name
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a -tzip "${{ matrix.artifact_name }}" "./${{ matrix.dist_path }}"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            if [[ -d "dist/${{ matrix.pyinstaller_name }}.app" ]]; then
              ditto -c -k --keepParent "dist/${{ matrix.pyinstaller_name }}.app" "${{ matrix.artifact_name }}"
            else
              cp "dist/${{ matrix.pyinstaller_name }}" "${{ matrix.pyinstaller_name }}"
              chmod +x "${{ matrix.pyinstaller_name }}"
              ditto -c -k "${{ matrix.pyinstaller_name }}" "${{ matrix.artifact_name }}"
            fi
          else
            cp "${{ matrix.dist_path }}" "${{ matrix.artifact_name }}"
            chmod +x "${{ matrix.artifact_name }}"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: ${{ matrix.artifact_name }}
